# Casper Via (Meson6, mainline): only the knobs this board actually exposes.
# No cpufreq/cpuidle in mainline for Meson6, and AXP209 AC/USB supplies are absent
# (no IRQ), so TLP always runs its battery profile.
TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=1
WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on
USB_AUTOSUSPEND=1
# MT7601U drops the link when autosuspended
USB_DENYLIST="148f:7601"
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
